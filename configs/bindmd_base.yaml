seed: 42
data:
  root: /data/shared/zwr/GOAI/NeuralMD/data_runtime/MISATO
  history_frames: 8
  pocket_cutoff: 12.0
  max_pocket_residues: 128
  batch_size: 8
  num_workers: 4
model:
  hidden_dim: 128
  num_heads: 4
  num_layers: 6
  num_rbf: 32
  rbf_max: 20.0
  dropout: 0.1
  diffusion_steps: 100
  diffusion_schedule: linear
  max_displacement: 5.0
  max_atomic_number: 118
training:
  epochs: 100
  learning_rate: 0.0002
  weight_decay: 0.00001
  grad_clip: 1.0
  amp: true
  history_noise_max: 0.10
  pair_loss_weight: 0.05
  checkpoint_dir: outputs/checkpoints
evaluation:
  split: test
  scenarios: [T1, T2, T3]
  ddim_steps: 10
  max_complexes: 0
  output: outputs/bindmd_test.json
