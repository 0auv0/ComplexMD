seed: 42
data:
  root: /data/shared/zwr/GOAI/NeuralMD/data_runtime/MISATO
  neuralmd_repo: /data/shared/zwr/GOAI/NeuralMD
  aligned_cache_dir: outputs/misato_aligned_full/cache
  topology_cache_dir: outputs/misato_aligned_full/topology
  history_frames: 8
  pocket_cutoff: 12.0
  max_pocket_residues: 128
  batch_size: 8
  num_workers: 4
model:
  generation_method: se3_torsion_flow
  hidden_dim: 128
  num_heads: 4
  num_layers: 6
  num_rbf: 32
  rbf_max: 20.0
  dropout: 0.1
  diffusion_steps: 100
  diffusion_schedule: linear
  max_displacement: 5.0
  max_atomic_number: 118
  flow_base_scale: 1.0
  flow_time_scale: 1000.0
  flow_solver: heun
  translation_base_scale: 0.10
  rotation_base_scale: 0.05
  torsion_base_scale: 0.10
  endpoint_loss_weight: 0.10
  projection_regularization: 0.0001
training:
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.00001
  grad_clip: 1.0
  amp: true
  history_noise_max: 0.0
  pair_loss_weight: 0.05
  checkpoint_dir: outputs/misato_aligned_full_se3_torsion_flow/checkpoints
evaluation:
  split: test
  scenarios: [T1, T2, T3]
  sampling_steps: 10
  batch_size: 8
  max_complexes: 0
  output: outputs/misato_aligned_full_se3_torsion_flow/bindmd_se3_torsion_test.json

