seed: 42
data:
  root: /data/shared/zwr/GOAI/NeuralMD/data_runtime/MISATO
  neuralmd_repo: /data/shared/zwr/GOAI/NeuralMD
  aligned_cache_dir: outputs/misato_hierarchical_pose/cache
  qm_hdf5: /data/shared/zwr/GOAI/dataset/QM.hdf5
  # Twelve causal frames: the four older frames provide the historical trend,
  # while the eight frames immediately before prediction describe current motion.
  history_frames: 12
  pocket_cutoff: 12.0
  max_pocket_residues: 128
  batch_size: 8
  num_workers: 4
model:
  generation_method: hierarchical_pose_rigid_fragment_flow
  hidden_dim: 128
  num_heads: 4
  num_layers: 6
  num_rbf: 32
  rbf_max: 20.0
  dropout: 0.1
  diffusion_steps: 100
  diffusion_schedule: linear
  max_displacement: 5.0
  max_atomic_number: 118
  flow_base_scale: 1.0
  flow_time_scale: 1000.0
  flow_solver: heun
  translation_base_scale: 0.10
  rotation_base_scale: 0.05
  torsion_base_scale: 0.0
  torsion_target_scale: 1.0
  torsion_step_limit_deg: 45.0
  translation_step_limit: 0.5
  rotation_step_limit_deg: 5.0
  endpoint_loss_weight: 0.10
  projection_regularization: 0.0001
  fragment_velocity_scale: 1.0
  current_window_frames: 8
  historical_window_frames: 4
  # Explicit aliases are required by the joint multiple-inheritance model so
  # the rigid-fragment head receives the same split as the pocket-pose head.
  fragment_current_window_frames: 8
  fragment_historical_window_frames: 4
  torsion_confidence_threshold: 0.55
  torsion_confidence_target_deg: 5.0
  torsion_confidence_loss_weight: 0.10
  pose_max_translation: 5.0
  pose_max_rotation_deg: 15.0
  pose_loss_weight: 1.0
  ligand_loss_weight: 0.25
  pose_rotation_loss_weight: 25.0
training:
  # Train all branches from random initialization. Validation will select the
  # checkpoint; no --initialize or --resume checkpoint is used for this run.
  epochs: 30
  learning_rate: 0.00005
  weight_decay: 0.00001
  grad_clip: 1.0
  amp: true
  history_noise_max: 0.10
  pair_loss_weight: 0.05
  checkpoint_dir: outputs/misato_rigid_fragments_v4_window12_current8_history4_scratch/checkpoints
evaluation:
  split: test
  scenarios: [T1, T2, T3]
  sampling_steps: 10
  batch_size: 4
  max_complexes: 0
  output: outputs/misato_rigid_fragments_v4_window12_current8_history4_scratch/evaluation/test_t1_t2_t3.json
