seed: 42
data:
  history_frames: 8
  pocket_cutoff: 12.0
  max_pocket_residues: 128
model:
  generation_method: hierarchical_pose_flow
  hidden_dim: 128
  num_heads: 4
  num_layers: 6
  num_rbf: 32
  rbf_max: 20.0
  dropout: 0.1
  diffusion_steps: 100
  diffusion_schedule: linear
  max_displacement: 5.0
  max_atomic_number: 118
  flow_base_scale: 1.0
  flow_time_scale: 1000.0
  flow_solver: heun
  internal_deformation_scale: 0.0
  pose_max_translation: 5.0
  pose_max_rotation_deg: 15.0
  pose_loss_weight: 1.0
  ligand_loss_weight: 0.25
  pose_rotation_loss_weight: 25.0
evaluation:
  sampling_steps: 10
  internal_deformation_scale: 0.0
  flow_base_scale: 0.5

