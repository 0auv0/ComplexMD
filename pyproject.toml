[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complexmd"
version = "0.1.0"
description = "Multi-scale protein-ligand complex molecular-dynamics forecasting"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = {text = "MIT"}
dependencies = [
  "numpy==1.26.4",
  "PyYAML==6.0.2",
  "torch==2.2.0",
  "torch-geometric==2.5.2",
  "tqdm==4.67.1",
  "h5py==3.14.0",
  "MDAnalysis==2.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
goai = ["mdtraj>=1.10"]
goai-mda = ["MDAnalysis>=2.6"]

[tool.setuptools.packages.find]
include = ["bindmd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
