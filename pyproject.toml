[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complexmd"
version = "0.1.0"
description = "Multi-scale protein-ligand complex molecular-dynamics forecasting"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "torch>=2.1",
  "torch-geometric>=2.4",
  "tqdm>=4.66",
  "h5py>=3.10",
  "MDAnalysis>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
goai = ["mdtraj>=1.10"]
goai-mda = ["MDAnalysis>=2.6"]

[tool.setuptools.packages.find]
include = ["bindmd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
